name: Grow wiki (daily)

# Adds new encyclopedia entries once a day — evenly across all sections — and
# commits them to the repo. It only ADDS to the existing corpus; it never
# replaces what is already there. Each run also re-resolves cross-links and
# regenerates graph.json (nodes/edges), so the knowledge-graph page grows
# automatically with the corpus.
#
# Rate: throttled to 1 new entry/day. The grow script rotates the target
# section each day so coverage stays even across categories over a week.
# Bump `total` later to grow faster.
#
# Deployment:
#   * If the repo is connected to Cloudflare Pages via Git integration,
#     Cloudflare auto-builds and deploys on the push below — no token needed.
#   * As a fallback (e.g. direct-upload projects), if a CLOUDFLARE_API_TOKEN
#     secret is present, the site is built here and deployed with wrangler.

on:
  schedule:
    - cron: "0 0 * * *" # once a day at 00:00 UTC
  workflow_dispatch:
    inputs:
      total:
        description: "New entries to add this run (all sections combined)"
        default: "1"

concurrency:
  group: grow-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      TOTAL: ${{ github.event.inputs.total || '1' }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: "7c486fb2ca6b72301939bdbc6e836332"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Add new terms (1/day, rotating section)
        run: python wiki/grow.py --per-category 1 --total "$TOTAL"

      - name: Build pages (gather -> synthesize -> resolve -> export)
        run: python wiki/run.py --limit 5

      - name: Commit new content
        id: commit
        run: |
          git config user.name "ukraine-wiki-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-wiki web/src/data/wiki
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new content this run."
          else
            git commit -m "chore(content): daily growth ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Fallback deploy (only if a Cloudflare API token secret is set) ---
      - name: Set up Node
        if: steps.commit.outputs.changed == 'true' && env.CF_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        if: steps.commit.outputs.changed == 'true' && env.CF_API_TOKEN != ''
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=all-about-ukraine --branch=main
